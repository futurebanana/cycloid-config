---
version: "2"
use_cases:

- name: aws
  sections:

  - name: Compute Instance
    groups:
    - name: Access Configuration
      technologies: [pipeline]
      vars:
      - name: "AWS Account"
        description: "The AWS account where to deploy the infrastructure. It contains access key and secret key."
        key: aws_cred
        widget: cy_cred
        widget_config:
          display_keys: false
          cred_types:
            - aws
        type: string
        default: "((aws))"
        required: true

      - name: "AWS Region"
        description: "AWS region to use for Terraform."
        key: aws_region
        widget: auto_complete
        type: string
        default: "eu-west-1"
        values_ref: https://cycloid-demo-stackforms-values.s3.eu-west-1.amazonaws.com/aws-regions.json
        required: true

      - name: "Flatcar version"
        description: "Flatcar version to use for the VM."
        key: flatcar_version
        widget: slider_list
        type: string
        default: "4230.2.1"
        values:
            - "4230.2.1"
        required: true

    - name: VM Specs
      technologies: [terraform]
      vars:
      - name: "Instance type"
        description: "Instance type for the VM."
        key: vm_instance_type
        widget: slider_list
        type: string
        default: "t3a.small"
        values:
            - "t3a.small"
            - "t3a.medium"
            - "t3a.large"
        required: true

      - name: "Disk size"
        unit: Go
        description: "Disk size for the VM."
        key: vm_disk_size
        widget: slider_range
        type: integer
        default: 20
        values:
            - 20
            - 250
        required: true

  - name: Hosts
    groups:

    - name: Inventory Targeting
      technologies: [pipeline]
      vars:
      - name: "Hosts Inventory"

        description: "An Ansible Hosts pattern to target hosts in your dynamic inventory using resource tags. For example, to target all the instances tagged with role=fe AND env=prod, you would enter here: tag_role_fe:&tag_env_prod"

        key: hosts_inventory
        type: string
        widget: simple_text

        default: "tag_cyorg_($ .organization_canonical $):tag_cypro_($ .project $):&tag_cyenv_($ .environment $)"

        required: true
    - name: Hosts Connectivity
      technologies: [pipeline]
      vars:
      - name: "Hosts Username"
        description: "The username to connect to via SSH to execute the Ansible playbook"
        key: hosts_username
        type: string
        widget: simple_text
        default: "core"
        required: true
      - name: "SSH Private key"
        description: "The private SSH key to connect via SSH to execute the Ansible playbook. The Cycloid workers shall be able to connect to targeted hosts via a public IP address."
        key: hosts_private_key
        type: string
        widget: cy_cred
        default: ((key_pair.private_key))
        required: true
